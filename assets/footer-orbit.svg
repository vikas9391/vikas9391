<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
<defs>
<linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".55" stop-color="#111827"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
<linearGradient id="g"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<filter id="gl"><feGaussianBlur stdDeviation="8" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.orb{transform-origin:600px 150px;animation:r 8s linear infinite}.orb2{transform-origin:600px 150px;animation:r 13s linear infinite reverse}.dot{animation:p 2.5s ease-in-out infinite}.wave{animation:w 4s ease-in-out infinite}
@keyframes r{to{transform:rotate(360deg)}}@keyframes p{50%{opacity:.15;transform:scale(.55)}}@keyframes w{50%{transform:translateY(-8px)}}
</style>
</defs>
<rect width="1200" height="320" rx="28" fill="url(#b)"/>
<g opacity=".12" stroke="#64748b"><path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/><path d="M100 0V320M200 0V320M300 0V320M400 0V320M500 0V320M600 0V320M700 0V320M800 0V320M900 0V320M1000 0V320M1100 0V320"/></g>
<g class="orb" fill="none" stroke="url(#g)" opacity=".6"><ellipse cx="600" cy="150" rx="230" ry="65" stroke-width="2"/><ellipse cx="600" cy="150" rx="230" ry="65" transform="rotate(60 600 150)"/><ellipse cx="600" cy="150" rx="230" ry="65" transform="rotate(120 600 150)"/></g>
<g class="orb2" fill="none" stroke="#38bdf8" opacity=".25"><ellipse cx="600" cy="150" rx="300" ry="92"/></g>
<g filter="url(#gl)"><circle cx="600" cy="150" r="34" fill="#0f172a" stroke="url(#g)" stroke-width="3"/><circle class="dot" cx="600" cy="150" r="13" fill="#38bdf8"/></g>
<g class="wave">
<text x="600" y="70" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="7">END OF PROFILE</text>
<text x="600" y="235" text-anchor="middle" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="600" letter-spacing="5">GUMMADALA VIKAS</text>
<text x="600" y="266" text-anchor="middle" fill="#7dd3fc" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="4">ENGINEERING THE NEXT IDEA</text>
</g>
</svg>