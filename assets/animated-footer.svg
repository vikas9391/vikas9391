<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".5" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.p1{animation:pulse 2.8s ease-in-out infinite}.p2{animation:pulse 2.8s ease-in-out .8s infinite}.p3{animation:pulse 2.8s ease-in-out 1.6s infinite}
.orbit{transform-origin:600px 128px;animation:spin 9s linear infinite}.scan{animation:scan 4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.65)}} @keyframes spin{to{transform:rotate(360deg)}} @keyframes scan{0%{transform:translateX(-260px);opacity:0}35%{opacity:1}100%{transform:translateX(260px);opacity:0}}
</style>
</defs>
<rect width="1200" height="260" rx="28" fill="url(#bg)"/>
<path d="M0 38 C170 5 270 70 420 38 S680 5 820 38 S1040 70 1200 38" fill="none" stroke="#1e3a8a" stroke-width="2" opacity=".6"/>
<g class="orbit" fill="none" stroke="url(#line)" opacity=".55"><ellipse cx="600" cy="128" rx="220" ry="58" stroke-width="1.5"/><ellipse cx="600" cy="128" rx="220" ry="58" stroke-width="1.5" transform="rotate(60 600 128)"/><ellipse cx="600" cy="128" rx="220" ry="58" stroke-width="1.5" transform="rotate(120 600 128)"/></g>
<g filter="url(#glow)">
<circle class="p1" cx="600" cy="128" r="22" fill="#38bdf8" opacity=".8"/><circle class="p2" cx="600" cy="128" r="42" fill="none" stroke="#3b82f6" stroke-width="2"/><circle class="p3" cx="600" cy="128" r="68" fill="none" stroke="#6366f1" stroke-width="1"/>
</g>
<path class="scan" d="M335 182H865" stroke="url(#line)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
<text x="600" y="86" text-anchor="middle" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="6">THANK YOU FOR VISITING</text>
<text x="600" y="205" text-anchor="middle" fill="#e2e8f0" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="4">BUILD • ENGINEER • EVOLVE</text>
</svg>